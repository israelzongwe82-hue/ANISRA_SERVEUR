services:
  - type: web
    name: anisra-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ANISRA_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anisra-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
databases:
  - name: anisra-db
    plan: basic-256mb
